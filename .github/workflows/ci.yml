name: CI

on:
  push:
    branches: [main, fix/student-class-enrollment-hardening]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wr_cursos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
      - name: Ruff
        run: cd api && ruff check app tests
      - name: Compile
        run: cd api && python -m compileall app
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wr_cursos_test
        run: cd api && alembic upgrade head
      - name: Run backend tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wr_cursos_test
        run: cd api && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run test:run -- --coverage
      - run: cd web && npm run build

  smoke:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose config
        run: docker compose config
      - name: Build and start services
        run: docker compose up -d --build --wait
      - name: Verify running containers
        run: docker compose ps
      - name: Apply migrations on empty database
        run: docker compose exec -T api alembic upgrade head
      - name: Smoke API
        run: |
          curl --fail --retry 10 --retry-delay 3 --max-time 5 http://localhost:8000/docs || exit 1
      - name: Smoke frontend
        run: |
          curl --fail --retry 10 --retry-delay 3 --max-time 5 http://localhost:5173/ || exit 1
      - name: Print logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
