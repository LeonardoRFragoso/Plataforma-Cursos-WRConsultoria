name: CI

on:
  push:
    branches: [main, feat/white-label-saas-commerce-completion]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wr_cursos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
      - name: Ruff
        run: cd api && ruff check app tests
      - name: Compile
        run: cd api && python -m compileall app
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wr_cursos_test
        run: cd api && alembic upgrade head
      - name: Run backend tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wr_cursos_test
        run: cd api && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run test:run -- --coverage
      - run: cd web && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npm run build
      # CI runs only the ui-mocked suite; the integration suite requires
      # a running backend+postgres and is covered by the smoke job.
      - run: cd web && npx playwright test --project=ui-mocked
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/

  smoke:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key-at-least-32-characters-long
      MERCADO_PAGO_MOCK_MODE: "true"
      PLAYWRIGHT_BASE_URL: http://localhost:5173
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # --- Node/Playwright setup BEFORE Docker up ---
      # The web service bind-mounts ./web into the container and uses a
      # named volume for /app/node_modules. If Docker starts first, the
      # container may create/touch web/node_modules with root ownership,
      # causing EACCES when the runner user later runs `npm ci`.
      # Installing deps on the runner first ensures correct ownership.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend deps (runner)
        run: cd web && npm ci
      - name: Install Playwright browsers (runner)
        run: cd web && npx playwright install --with-deps chromium
      # --- Docker stack ---
      - name: Docker Compose config
        run: docker compose config
      - name: Build images
        run: docker compose build
      - name: Start PostgreSQL only
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 2
          done
      - name: Run migrations on empty database
        run: docker compose run --rm api alembic upgrade head
      - name: Bootstrap E2E admin user
        env:
          E2E_TEST_MODE: "true"
        run: docker compose run --rm -e E2E_TEST_MODE=true api python -m app.scripts.e2e_bootstrap
      - name: Start API and frontend
        run: docker compose up -d --wait api web
      - name: Verify running containers
        run: docker compose ps
      - name: Smoke API
        run: |
          curl --fail --retry 10 --retry-delay 3 --max-time 5 http://localhost:8000/docs || exit 1
      - name: Smoke frontend
        run: |
          curl --fail --retry 10 --retry-delay 3 --max-time 5 http://localhost:5173/ || exit 1
      - name: Run full-stack integration Playwright
        run: |
          cd web && npx playwright test --project=integration
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report
          path: web/playwright-report/
      - name: Print logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      # VITE_API_URL is now a required BUILD-TIME argument for the web image
      # (see web/Dockerfile.prod). Provide a deterministic, non-secret value so
      # `docker compose config` can interpolate the production compose file in CI.
      - name: Validate production compose config
        env:
          VITE_API_URL: https://api.release-test.example
          DB_USER: wr_app
          DB_PASSWORD: dummy
          DB_NAME: wr_cursos
          SECRET_KEY: dummy-secret-key-at-least-32-characters-long-xxx
          TENANT_SECRET_ENCRYPTION_KEY: dGhpcy1pcy1hLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmc=
          ALLOWED_HOSTS: '["api.example.com"]'
          CORS_ORIGINS: '["https://app.example.com"]'
          FRONTEND_URL: https://app.example.com
        run: docker compose -f docker-compose.prod.yml config

  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build -f api/Dockerfile.prod -t wr-api:prod ./api
      - name: Build production web image (without VITE_API_URL must fail)
        run: |
          set +e
          docker build -f web/Dockerfile.prod -t wr-web:prod-no-arg ./web >/tmp/build-no-arg.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: web image built successfully WITHOUT VITE_API_URL — the build-time contract is broken."
            cat /tmp/build-no-arg.log
            exit 1
          fi
          echo "PASS: web image build correctly failed without VITE_API_URL."
          grep -q "VITE_API_URL build argument is required" /tmp/build-no-arg.log || {
            echo "ERROR: build failed but not with the expected VITE_API_URL message.";
            cat /tmp/build-no-arg.log;
            exit 1;
          }
      - name: Build production web image (with VITE_API_URL)
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.release-test.example \
            -f web/Dockerfile.prod \
            -t wr-web:prod \
            ./web
      - name: Verify frontend production API endpoint
        run: |
          # Inspect the ACTUAL compiled runtime assets inside the built image —
          # not the source files. The release-test URL must be embedded and the
          # development fallback (http://localhost:8000) must NOT appear as the
          # API endpoint in the API client bundle.
          docker run --rm --entrypoint sh wr-web:prod -c '
            found=$(grep -rl "https://api.release-test.example" /usr/share/nginx/html/assets/ 2>/dev/null | head -1)
            if [ -z "$found" ]; then
              echo "FAIL: release-test API URL not found in compiled assets."
              exit 1
            fi
            echo "PASS: release-test API URL embedded in: $found"
            if grep -r "http://localhost:8000" /usr/share/nginx/html/assets/ 2>/dev/null; then
              echo "FAIL: development fallback http://localhost:8000 found in compiled assets."
              exit 1
            fi
            echo "PASS: no localhost:8000 fallback in compiled assets."
          '
      - name: Verify API image starts and healthcheck passes (dev mode)
        run: |
          docker run -d --name wr-api-test \
            -e ENVIRONMENT=development \
            -e SECRET_KEY=test-secret-key-at-least-32-characters-long \
            -e DATABASE_URL=postgresql+asyncpg://dummy:dummy@localhost:5432/dummy \
            -p 18000:8000 \
            wr-api:prod
          sleep 5
          curl -fsS http://localhost:18000/health/live || { docker logs wr-api-test; exit 1; }
          docker rm -f wr-api-test
      - name: Verify production-mode startup fail-closed contract
        env:
          # Safe, fake, non-secret test configuration. No real credentials.
          # SECRET_KEY intentionally differs from the placeholder blocklist.
          SECRET_KEY: ci-prod-smoke-secret-key-not-a-placeholder-32+
          TENANT_SECRET_ENCRYPTION_KEY: dGhpcy1pcy1hLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmc=
          ALLOWED_HOSTS: '["api.release-test.example"]'
          CORS_ORIGINS: '["https://app.release-test.example"]'
        run: |
          # The API must boot in production mode with safe fake config and
          # enforce the fail-closed contract (no docs, liveness works without DB).
          docker run -d --name wr-api-prod-smoke \
            -e ENVIRONMENT=production \
            -e SECRET_KEY="$SECRET_KEY" \
            -e TENANT_SECRET_ENCRYPTION_KEY="$TENANT_SECRET_ENCRYPTION_KEY" \
            -e DATABASE_URL=postgresql+asyncpg://dummy:dummy@localhost:5432/dummy \
            -e ALLOWED_HOSTS="$ALLOWED_HOSTS" \
            -e CORS_ORIGINS="$CORS_ORIGINS" \
            -e MERCADO_PAGO_MOCK_MODE=false \
            -e RATE_LIMIT_ENABLED=true \
            -e DOCS_ENABLED=false \
            -p 18001:8000 \
            wr-api:prod
          sleep 6
          # /health/live must be 200 (no DB dependency). Use an allowed Host.
          curl -fsS -H "Host: api.release-test.example" http://localhost:18001/health/live \
            || { echo "--- /health/live failed; logs: ---"; docker logs wr-api-prod-smoke; exit 1; }
          # /docs must be 404 (DOCS_ENABLED=false).
          docs_status=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: api.release-test.example" http://localhost:18001/docs)
          if [ "$docs_status" != "404" ]; then
            echo "FAIL: /docs returned $docs_status, expected 404 (DOCS_ENABLED=false)."
            docker logs wr-api-prod-smoke
            exit 1
          fi
          echo "PASS: /docs correctly disabled (404) in production mode."
          docker rm -f wr-api-prod-smoke
      - name: Verify web image serves static files
        run: |
          docker run -d --name wr-web-test -p 18080:80 wr-web:prod
          sleep 3
          curl -fsS http://localhost:18080/health || { docker logs wr-web-test; exit 1; }
          docker rm -f wr-web-test

  white-label-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wr_white_label
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Staging mode — exercises trusted Origin tenant security
      ENVIRONMENT: staging
      SECRET_KEY: ci-white-label-secret-key-at-least-32-chars
      TENANT_SECRET_ENCRYPTION_KEY: dGhpcy1pcy1hLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmc=
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wr_white_label
      MERCADO_PAGO_MOCK_MODE: "true"
      DEMO_SEED_MODE: "true"
      DOCS_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      MASTER_HOST: localhost
      CORS_ORIGINS: '["http://127.0.0.1:4173","http://127.0.0.1:4174"]'
      TRUSTED_FRONTEND_ORIGINS: '["http://127.0.0.1:4173","http://127.0.0.1:4174"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
      # Demo seed credentials (deterministic, CI-only)
      DEMO_WR_ADMIN_EMAIL: admin@wr.demo
      DEMO_WR_ADMIN_PASSWORD: test-wr-admin-pass
      DEMO_ALFA_ADMIN_EMAIL: admin@alfa.demo
      DEMO_ALFA_ADMIN_PASSWORD: test-alfa-admin-pass
      DEMO_WR_STUDENT_PASSWORD: test-wr-student-pass
      DEMO_ALFA_STUDENT_PASSWORD: test-alfa-student-pass
      DEMO_SUPER_ADMIN_EMAIL: super@wr.demo
      DEMO_SUPER_ADMIN_PASSWORD: test-super-admin-pass
      # Playwright spec env
      WHITE_LABEL_INTEGRATION_REQUIRED: "true"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      API_BASE: http://localhost:8000
      WR_URL: http://127.0.0.1:4173
      ALFA_URL: http://127.0.0.1:4174
      DEMO_ALFA_STUDENT_EMAIL: aluno1@alfa.demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ─── Backend deps ───
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      # ─── Frontend deps ───
      - name: Install frontend deps
        run: cd web && npm ci

      # ─── Playwright ───
      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      # ─── Wait for PostgreSQL ───
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done

      # ─── Run real Alembic migrations ───
      - name: Run Alembic migrations
        run: cd api && alembic upgrade head

      # ─── Seed first run ───
      - name: Run demo seed (first run)
        run: cd api && python -m app.scripts.seed_white_label_demo

      # ─── Record counts after first seed ───
      - name: Record counts after first seed
        id: counts1
        run: |
          cd api && python -c "
          import asyncio, os
          from sqlalchemy import select, func
          from app.core.database import AsyncSessionLocal
          from app.models.tenant import Tenant, PartnerLead
          from app.models.user import User
          from app.models.student import Student
          from app.models.course import Course
          from app.models.class_model import Class
          from app.models.enrollment import Enrollment
          from app.models.payment import Payment
          from app.models.certificate import Certificate
          from app.models.plan import Plan
          from app.models.tenant_subscription import TenantSubscription

          async def main():
              async with AsyncSessionLocal() as db:
                  for label, model in [
                      ('tenants', Tenant), ('users', User), ('students', Student),
                      ('courses', Course), ('classes', Class), ('enrollments', Enrollment),
                      ('payments', Payment), ('certificates', Certificate),
                      ('plans', Plan), ('subscriptions', TenantSubscription),
                  ]:
                      count = (await db.execute(select(func.count()).select_from(model))).scalar()
                      print(f'{label}={count}')
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write(f'{label}={count}\n')
                      print(f'{label}={count}')

          asyncio.run(main())
          "

      # ─── Seed second run (idempotency) ───
      - name: Run demo seed (second run — idempotency)
        run: cd api && python -m app.scripts.seed_white_label_demo

      # ─── Verify counts match ───
      - name: Verify idempotency (counts unchanged)
        run: |
          cd api && python -c "
          import asyncio
          from sqlalchemy import select, func
          from app.core.database import AsyncSessionLocal
          from app.models.tenant import Tenant
          from app.models.user import User
          from app.models.student import Student
          from app.models.course import Course
          from app.models.class_model import Class
          from app.models.enrollment import Enrollment
          from app.models.payment import Payment
          from app.models.certificate import Certificate
          from app.models.plan import Plan
          from app.models.tenant_subscription import TenantSubscription

          expected = {
              'tenants': ${{ steps.counts1.outputs.tenants }},
              'users': ${{ steps.counts1.outputs.users }},
              'students': ${{ steps.counts1.outputs.students }},
              'courses': ${{ steps.counts1.outputs.courses }},
              'classes': ${{ steps.counts1.outputs.classes }},
              'enrollments': ${{ steps.counts1.outputs.enrollments }},
              'payments': ${{ steps.counts1.outputs.payments }},
              'certificates': ${{ steps.counts1.outputs.certificates }},
              'plans': ${{ steps.counts1.outputs.plans }},
              'subscriptions': ${{ steps.counts1.outputs.subscriptions }},
          }

          async def main():
              async with AsyncSessionLocal() as db:
                  for label, model in [
                      ('tenants', Tenant), ('users', User), ('students', Student),
                      ('courses', Course), ('classes', Class), ('enrollments', Enrollment),
                      ('payments', Payment), ('certificates', Certificate),
                      ('plans', Plan), ('subscriptions', TenantSubscription),
                  ]:
                      count = (await db.execute(select(func.count()).select_from(model))).scalar()
                      exp = expected[label]
                      if count != exp:
                          print(f'FAIL: {label} count changed: {exp} → {count}')
                          raise SystemExit(1)
                      print(f'OK: {label}={count}')

          asyncio.run(main())
          print('Idempotency verified: all counts stable across two seed runs.')
          "

      # ─── Verify SUPER_ADMIN exists and is unique ───
      - name: Verify SUPER_ADMIN exists and is unique
        run: |
          cd api && python -c "
          import asyncio
          from sqlalchemy import select, func
          from app.core.database import AsyncSessionLocal
          from app.models.user import User, UserRole

          async def main():
              async with AsyncSessionLocal() as db:
                  count = (await db.execute(
                      select(func.count()).select_from(User).where(User.role == UserRole.SUPER_ADMIN)
                  )).scalar()
                  if count != 1:
                      print(f'FAIL: expected 1 SUPER_ADMIN, found {count}')
                      raise SystemExit(1)
                  print(f'OK: SUPER_ADMIN count={count}')

          asyncio.run(main())
          "

      # ─── Start FastAPI in staging mode ───
      - name: Start FastAPI (staging)
        run: |
          cd api && uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8000/health/live && break
            sleep 2
          done

      # ─── Build WR frontend ───
      - name: Build WR frontend
        run: |
          cd web
          VITE_API_URL=http://localhost:8000 VITE_TENANT_SLUG=wr npm run build
          mv dist /tmp/wr-dist

      # ─── Build Alfa frontend ───
      - name: Build Alfa frontend
        run: |
          cd web
          VITE_API_URL=http://localhost:8000 VITE_TENANT_SLUG=alfa npm run build
          mv dist /tmp/alfa-dist

      # ─── Start WR frontend (:4173) ───
      - name: Start WR frontend (:4173)
        run: |
          cat > /tmp/spa-server.js << 'SCRIPT'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2];
          const port = parseInt(process.argv[3]);
          const mime = { '.html':'text/html', '.js':'text/javascript', '.css':'text/css', '.json':'application/json', '.png':'image/png', '.jpg':'image/jpeg', '.svg':'image/svg+xml', '.ico':'image/x-icon', '.woff':'font/woff', '.woff2':'font/woff2', '.map':'application/json' };
          const server = http.createServer((req, res) => {
            let urlPath = req.url.split('?')[0];
            let filePath = path.join(root, urlPath);
            if (urlPath === '/' || !fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
              if (!fs.existsSync(filePath) && !urlPath.startsWith('/assets/')) {
                filePath = path.join(root, 'index.html');
              } else if (fs.existsSync(filePath) && fs.statSync(filePath).isDirectory()) {
                filePath = path.join(filePath, 'index.html');
              }
            }
            fs.readFile(filePath, (err, data) => {
              if (err) { res.writeHead(404); res.end('Not found'); return; }
              const ext = path.extname(filePath);
              res.writeHead(200, { 'Content-Type': mime[ext] || 'application/octet-stream' });
              res.end(data);
            });
          });
          server.listen(port, '127.0.0.1', () => console.log(`SPA server on :${port}`));
          SCRIPT
          node /tmp/spa-server.js /tmp/wr-dist 4173 > /tmp/wr-fe.log 2>&1 &
          echo $! > /tmp/wr-fe.pid

      # ─── Start Alfa frontend (:4174) ───
      - name: Start Alfa frontend (:4174)
        run: |
          node /tmp/spa-server.js /tmp/alfa-dist 4174 > /tmp/alfa-fe.log 2>&1 &
          echo $! > /tmp/alfa-fe.pid

      # ─── Health checks ───
      - name: Health check WR frontend
        run: |
          for i in {1..15}; do
            curl -fsS http://127.0.0.1:4173/ && break
            sleep 2
          done
      - name: Health check Alfa frontend
        run: |
          for i in {1..15}; do
            curl -fsS http://127.0.0.1:4174/ && break
            sleep 2
          done

      # ─── Run integration-white-label Playwright ───
      - name: Run white-label integration Playwright
        run: |
          cd web && npx playwright test e2e/integration/integration-white-label.spec.js --project=integration --reporter=json --output=/tmp/pw-results > /tmp/pw-result.json 2>&1
          exit_code=$?
          # Display the results
          cat /tmp/pw-result.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          stats = data.get('stats', {})
          print(f'Passed: {stats.get(\"expected\", 0)}')
          print(f'Failed: {stats.get(\"unexpected\", 0)}')
          print(f'Skipped: {stats.get(\"skipped\", 0)}')
          print(f'Flaky: {stats.get(\"flaky\", 0)}')
          for s in data.get('suites', []):
              for spec in s.get('specs', []):
                  for t in spec.get('tests', []):
                      status = t.get('status', 'unknown')
                      title = spec.get('title', 'unknown')
                      print(f'  {status.upper()}: {title}')
          sys.exit(0)
          " || true
          # Check for failures
          if [ $exit_code -ne 0 ]; then
            echo "FAIL: Playwright tests failed (exit code $exit_code)"
            exit 1
          fi
          # Check for skips
          skipped=$(python3 -c "
          import json
          with open('/tmp/pw-result.json') as f:
              data = json.load(f)
          print(data.get('stats', {}).get('skipped', 0))
          " 2>/dev/null || echo "unknown")
          echo "Skipped tests: $skipped"
          if [ "$skipped" != "0" ]; then
            echo "FAIL: $skipped required tests were skipped — zero skips allowed."
            exit 1
          fi
          echo "PASS: all required tests passed, zero skipped."

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-white-label-report
          path: web/playwright-report/

      - name: Print logs on failure
        if: failure()
        run: |
          echo "=== API LOG ===" && cat /tmp/api.log 2>/dev/null | tail -50
          echo "=== WR FE LOG ===" && cat /tmp/wr-fe.log 2>/dev/null | tail -20
          echo "=== ALFA FE LOG ===" && cat /tmp/alfa-fe.log 2>/dev/null | tail -20

      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/api.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/wr-fe.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/alfa-fe.pid 2>/dev/null) 2>/dev/null || true
