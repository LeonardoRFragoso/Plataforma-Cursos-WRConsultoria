<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma de cursos e certificados" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" /></noscript>
    <title>Plataforma de Cursos</title>
    <style>
      #app-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #ffffff; color: #17324D; font-family: system-ui, -apple-system,
          'Segoe UI', Roboto, sans-serif; z-index: 9999;
      }
      #app-boot .boot-spinner {
        width: 36px; height: 36px; border: 3px solid #e5e7eb;
        border-top-color: #047F37; border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #app-boot .boot-text { font-size: 14px; font-weight: 500; opacity: 0.7; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <div class="boot-spinner"></div>
        <div class="boot-text">Carregando plataforma…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
