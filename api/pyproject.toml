[project]
name = "wr-cursos-api"
version = "0.1.0"
requires-python = ">=3.12"
# Dependencies are managed via requirements.txt for the application runtime.
# This [project] table exists so that tooling (uv, Vercel build detection)
# can resolve project metadata without failing.
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["venv"]

# FastAPI e dependências de autenticação usam `Depends` nos defaults de
# argumentos; esta é a prática canônica do framework, portanto ignoramos a
# regra B008 para evitar ruído de falsos positivos.
lint.ignore = ["B008"]
